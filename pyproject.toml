[project]
name = "kavach"
version = "0.1.0"
description = "Kavach — adversarial multi-agent commerce with a deterministic guardrail kernel"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7,<3",
  "cryptography>=42,<46",
  "textual>=0.70,<1",
  "rich>=13,<16",
  "anthropic>=0.40,<1",
  "python-dotenv>=1.0,<2",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
kavach = "kavach.cli:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["kavach*"]

[tool.setuptools.package-data]
kavach = ["static/*"]
